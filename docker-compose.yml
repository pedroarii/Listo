name: listo

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listo}
      POSTGRES_DB: ${POSTGRES_DB:-listo}
    ports:
      # 5432 is taken by another project on this machine.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18+ images keep data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
